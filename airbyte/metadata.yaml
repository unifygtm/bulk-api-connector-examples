# Connector metadata for the Unify Bulk API source.
#
# This is a manifest-only connector: it ships no Python, and runs on Airbyte's
# `source-declarative-manifest` base image, which interprets `manifest.yaml` at
# runtime. See https://docs.airbyte.com/platform/connector-development/connector-metadata-file
metadataSpecVersion: "1.0"
data:
  name: Unify Bulk
  # A unique, stable UUID for this connector definition. Generate your own with
  # `uuidgen` if you fork this; do not reuse another connector's id.
  definitionId: 3921663d-8fb3-41fc-bd59-f85f5cc94907
  connectorType: source
  connectorSubtype: api
  # Where you publish your built image. Replace the namespace with your own.
  dockerRepository: airbyte/source-unify-bulk
  dockerImageTag: 0.1.0
  # Manifest-only connectors are built on the declarative-manifest base image,
  # which contains the CDK runtime. Bump this tag to adopt newer CDK features.
  connectorBuildOptions:
    baseImage: docker.io/airbyte/source-declarative-manifest:7.23.1@sha256:f71ff70e2761f634c080233f6d718bb4bcf96fa310351d56e98ba58d43ab1c9f
  # Restrict outbound traffic to the Unify API.
  allowedHosts:
    hosts:
      - "api.unifygtm.com"
  releaseStage: alpha
  supportLevel: community
  documentationUrl: https://docs.unifygtm.com/developers/guides/request-data/bulk-api
  tags:
    - language:manifest-only
    - cdk:low-code
  ab_internal:
    ql: 100
    sl: 100
